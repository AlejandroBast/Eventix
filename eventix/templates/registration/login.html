{% extends 'base.html' %}

{% block title %}Entrar | Eventix{% endblock %}

{% block content %}
<div class="auth-panel mx-auto">
  <h1 class="h3 mb-3">Iniciar sesion</h1>
  <form method="post" class="vstack gap-3">
    {% csrf_token %}
    <div>
      <label class="form-label" for="{{ form.username.id_for_label }}">Usuario</label>
      <input class="form-control" type="text" name="{{ form.username.html_name }}" id="{{ form.username.id_for_label }}" required autofocus>
    </div>
    <div>
      <label class="form-label" for="{{ form.password.id_for_label }}">Contrasena</label>
      <input class="form-control" type="password" name="{{ form.password.html_name }}" id="{{ form.password.id_for_label }}" required>
    </div>
    {% if form.errors %}
      <div class="alert alert-danger mb-0">Usuario o contrasena incorrectos.</div>
    {% endif %}
    <button class="btn btn-primary" type="submit">Entrar</button>
  </form>
  <p class="mt-3 mb-0 small text-secondary">
    No tienes cuenta? <a href="{% url 'registro' %}">Registrate</a>.
  </p>
</div>
{% endblock %}
